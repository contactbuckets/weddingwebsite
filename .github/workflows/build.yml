name: Build ShaadiSutra and package Appwrite function
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        env:
          VITE_APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: 6afdb35c0036c36ebf2e
          VITE_CASHFREE_MODE: sandbox
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Package Appwrite Cashfree function and Appwrite Site source
        if: github.event_name != 'pull_request'
        run: |
          tar -czf functions/cashfree-payments/deployment.tar.gz -C functions/cashfree-payments index.js package.json
          git archive --format=tar HEAD | gzip > functions/cashfree-payments/site-source.tar.gz
      - name: Publish function package for Appwrite deployment
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/cashfree-payments/deployment.tar.gz functions/cashfree-payments/site-source.tar.gz
          if ! git diff --cached --quiet; then
            git commit -m "chore: package Cashfree Appwrite function"
            git push
          fi
      - name: Upload production build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shaadisutra-dist
          path: dist/
          retention-days: 14
