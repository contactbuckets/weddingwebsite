name: Build and deploy ShaadiSutra to GitHub Pages
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: shaadisutra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        env:
          VITE_APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: 6afdb35c0036c36ebf2e
          VITE_CASHFREE_MODE: sandbox
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Add static admin route for GitHub Pages
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
      - name: Publish site files to gh-pages branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
