name: Build and deploy ShaadiSutra
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        env:
          VITE_APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: 6afdb35c0036c36ebf2e
          VITE_CASHFREE_MODE: sandbox
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Package Appwrite Cashfree function
        if: github.event_name != 'pull_request'
        run: tar -czf functions/cashfree-payments/deployment.tar.gz -C functions/cashfree-payments index.js package.json
      - name: Publish function package for Appwrite deployment
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/cashfree-payments/deployment.tar.gz
          if ! git diff --cached --quiet; then
            git commit -m "chore: package Cashfree Appwrite function"
            git push
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
