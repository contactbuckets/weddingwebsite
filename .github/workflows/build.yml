name: Build and deploy ShaadiSutra to GitHub Pages
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: shaadisutra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        env:
          VITE_APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: 6afdb35c0036c36ebf2e
          VITE_CASHFREE_MODE: sandbox
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Add static admin route for GitHub Pages
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
      - name: Package Appwrite function and site source
        if: github.event_name != 'pull_request'
        run: |
          tar -czf functions/cashfree-payments/deployment.tar.gz -C functions/cashfree-payments index.js package.json
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' --exclude='./functions/cashfree-payments/*.tar.gz' -czf functions/cashfree-payments/site-source.tar.gz .
      - name: Publish Appwrite deployment packages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/cashfree-payments/deployment.tar.gz functions/cashfree-payments/site-source.tar.gz
          if ! git diff --cached --quiet; then
            git commit -m "chore: package Cashfree Appwrite function"
            git pull --rebase origin main
            git push
          fi
      - name: Publish site files to gh-pages branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
