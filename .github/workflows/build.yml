name: Build and deploy ShaadiSutra to GitHub Pages
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: shaadisutra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        env:
          VITE_APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: 6afdb35c0036c36ebf2e
          VITE_CASHFREE_MODE: sandbox
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Package Appwrite function and site source
        if: github.event_name != 'pull_request'
        run: |
          tar -czf functions/cashfree-payments/deployment.tar.gz -C functions/cashfree-payments index.js package.json
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' --exclude='./functions/cashfree-payments/*.tar.gz' -czf functions/cashfree-payments/site-source.tar.gz .
      - name: Publish Appwrite deployment packages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/cashfree-payments/deployment.tar.gz functions/cashfree-payments/site-source.tar.gz
          if ! git diff --cached --quiet; then
            git commit -m "chore: package Cashfree Appwrite function"
            git pull --rebase origin main
            git push
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
